name: Update Hawki-violet

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT UPDATE BRANCH
      # ============================================================
      - name: Checkout update branch
        uses: actions/checkout@v4
        with:
          ref: update
          fetch-depth: 0
          persist-credentials: false

      # ============================================================
      # 2. CONFIGURE GIT
      # ============================================================
      - name: Configure Git
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ============================================================
      # 3. UPDATE 17.0 FROM TBYOOL
      # ============================================================
      - name: Update 17.0 from tbyool
        env:
          GH_TOKEN: ${{ secrets.REPO_CREATE_TOKEN }}
        run: |
          set -e

          rm -rf tbyool-source

          git clone \
            --branch 17.0 \
            --single-branch \
            https://github.com/tbyool/android_kernel_xiaomi_sm6150.git \
            tbyool-source

          cd tbyool-source

          echo "=============================================="
          echo "tbyool source commit:"
          git rev-parse HEAD
          echo "=============================================="

          git remote add target \
            "https://x-access-token:${GH_TOKEN}@github.com/Red-A-Hawk/Hawki-violet.git"

          echo "Syncing tbyool 17.0..."

          git push target \
            HEAD:refs/heads/17.0 \
            --force

          echo "17.0 update completed."

      # ============================================================
      # 4. UPDATE STABLE FROM MANIPVLATOR
      # ============================================================
      - name: Update stable from manipvlator
        env:
          GH_TOKEN: ${{ secrets.REPO_CREATE_TOKEN }}
        run: |
          set -e

          rm -rf manipvlator-source

          git clone \
            --branch stable \
            --single-branch \
            https://github.com/manipvlator/los_kernel_xiaomi_sm6150.git \
            manipvlator-source

          cd manipvlator-source

          echo "=============================================="
          echo "manipvlator source commit:"
          git rev-parse HEAD
          echo "=============================================="

          git remote add target \
            "https://x-access-token:${GH_TOKEN}@github.com/Red-A-Hawk/Hawki-violet.git"

          echo "Syncing manipvlator stable..."

          git push target \
            HEAD:refs/heads/stable \
            --force

          echo "stable update completed."

      # ============================================================
      # 5. VERIFY BOTH BRANCHES
      # ============================================================
      - name: Verify synchronized branches
        env:
          GH_TOKEN: ${{ secrets.REPO_CREATE_TOKEN }}
        run: |
          set -e

          echo "=============================================="
          echo "Verifying Hawki-violet"
          echo "=============================================="

          TBYOOL_COMMIT=$(git -C tbyool-source rev-parse HEAD)

          MANIPVLATOR_COMMIT=$(git -C manipvlator-source rev-parse HEAD)

          HAWKI_17_COMMIT=$(git ls-remote \
            "https://x-access-token:${GH_TOKEN}@github.com/Red-A-Hawk/Hawki-violet.git" \
            refs/heads/17.0 | awk '{print $1}')

          HAWKI_STABLE_COMMIT=$(git ls-remote \
            "https://x-access-token:${GH_TOKEN}@github.com/Red-A-Hawk/Hawki-violet.git" \
            refs/heads/stable | awk '{print $1}')

          echo ""
          echo "tbyool 17.0:"
          echo "$TBYOOL_COMMIT"

          echo "Hawki-violet 17.0:"
          echo "$HAWKI_17_COMMIT"

          echo ""
          echo "manipvlator stable:"
          echo "$MANIPVLATOR_COMMIT"

          echo "Hawki-violet stable:"
          echo "$HAWKI_STABLE_COMMIT"

          echo ""
          echo "=============================================="
          echo "Checking 17.0"
          echo "=============================================="

          test "$TBYOOL_COMMIT" = "$HAWKI_17_COMMIT"

          echo "17.0: OK"

          echo ""
          echo "=============================================="
          echo "Checking stable"
          echo "=============================================="

          test "$MANIPVLATOR_COMMIT" = "$HAWKI_STABLE_COMMIT"

          echo "stable: OK"

          echo ""
          echo "=============================================="
          echo "ALL SYNCS VERIFIED SUCCESSFULLY"
          echo "=============================================="
